[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.seamcertification.org/*"
  to = "https://seamcertification.org/:splat"
  status = 301
  force = true

# Old Wix URL redirects
[[redirects]]
  from = "/accreditation"
  to = "/ap-credential"
  status = 301
  force = true

[[redirects]]
  from = "/become-seam-ap"
  to = "/ap-credential"
  status = 301
  force = true

[[redirects]]
  from = "/faqs"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
