# Wix auto-slugs and misc dead paths (originals unknown — send home)
[[redirects]]
  from = "/general-5"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/general-4"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/seam-eu"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/product-page/*"
  to = "/"
  status = 301
  force = true

# No forum on new site — route to contact
[[redirects]]
  from = "/forum/*"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/forum"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/opportunities"
  to = "/contact"
  status = 301
  force = true

# Funding/RFP-era pages — closest match is about
[[redirects]]
  from = "/funding"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/grants"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/rfa"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/rfp"
  to = "/about"
  status = 301
  force = true

# Old Wix-hosted files — send to standard resources
[[redirects]]
  from = "/_files/*"
  to = "/resources/standard"
  status = 301
  force = true

# Remaining GSC 404s (old Wix paths still crawled as of Jul 2026). /standard has
# subpages but no index route, so the bare path 404'd; the old standard/download
# pages map to the standard resources hub, and cidie-registration follows
# cidie-certification to /certification.
[[redirects]]
  from = "/standard"
  to = "/resources/standard"
  status = 301
  force = true

[[redirects]]
  from = "/standard-download"
  to = "/resources/standard"
  status = 301
  force = true

[[redirects]]
  from = "/cidie-registration"
  to = "/certification"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
